include dank-tabs.conf
include dank-theme.conf
window_padding_width 5
hide_window_decorations yes
background_opacity 0.7
font_family JetBrainsMono Nerd Font Mono:weight=semibold 
font_size 10.0
symbol_map U+E000-U+F8FF Symbols Nerd Font
symbol_map U+F0000-U+FFFFF Symbols Nerd Font
remember_window_size no
confirm_os_window_close 0
shell fish 
# 原生光标拖影（nvim 检测到 cursor_trail > 0 会自动关闭 smear-cursor，避免双重拖影）
cursor_trail 1
# 衰减越快拖影越小：fast slow（默认 0.1 0.4）
cursor_trail_decay 0.1 0.3
cursor_shape block
shell_integration no-cursor

# Pass Ctrl+H/J/K/L to Neovim for window navigation
map ctrl+h send_text normal \x1b[104;5u
map ctrl+j send_text normal \x1b[106;5u
map ctrl+k send_text normal \x1b[107;5u
map ctrl+l send_text normal \x1b[108;5u
