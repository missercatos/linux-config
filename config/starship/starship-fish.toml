format = """
[](#7aa2f7)\
[$os](bg:#7aa2f7 fg:#16161e)\
$username\
[](bg:#bb9af7 fg:#7aa2f7)\
[ ](bg:#bb9af7 fg:#16161e)\
$directory\
[](fg:#bb9af7 bg:#73daca)\
$git_branch\
$git_status\
([](fg:#73daca bg:#7dcfff)\
$c\
$golang\
$java\
$nodejs\
$python\
$rust\
$custom)\
([](fg:#7dcfff bg:#444b6a)\
$docker_context)\
([](fg:#444b6a bg:#2f3549)\
$time)\
[](fg:#7dcfff)\
$cmd_duration\
$line_break\
$character"""

# Disable the blank line at the start of the prompt
add_newline = true

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "fg:#16161e bg:#7aa2f7"
style_root = "fg:#16161e bg:#7aa2f7"
format = '[$user ]($style)'
disabled = false

[cmd_duration]
min_time = 0
format = 'took [$duration](bold #7aa2f7) on'

[character]
success_symbol = '[](bold green) '
error_symbol = '[](bold red) '

[hostname]
ssh_only = false
format = ' [$hostname](#73daca) '
disabled = false

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os.symbols]
CachyOS = "󰣇"
Arch = "󰣇"
Linux = "󰌽"

[os]
style = "bg:#7aa2f7 fg:#16161e"
format = "[$symbol ]($style)"
disabled = false

[directory]
style = "fg:#16161e bg:#bb9af7"
format = "[ $path ]($style)"
truncation_length = 0
truncate_to_repo = true

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = " "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = "  "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important  " = "  "

[c]
symbol = ""
style = "fg:#A8B9CC bg:#7dcfff"
format = '[ $symbol ]($style)'


[docker_context]
symbol = ""
style = "fg:#2496ED bg:#444b6a"
format = '[ $symbol $context ]($style) $path'

[git_branch]
symbol = ""
style = "fg:#16161e bg:#73daca"
format = '[ $symbol $branch ]($style)'


[git_status]
format = '[$all_status$ahead_behind]($style)'
style = "fg:#16161e bg:#73daca"
conflicted = "🏳"
up_to_date = " "
untracked = " "
ahead = "⇡${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
behind = "⇣${count}"
stashed = ""
modified = " "
staged = '[++\($count\)](bg:#73daca)'
renamed = "襁"
deleted = ""

[golang]
symbol = " "
style = "fg:#00ADD8 bg:#7dcfff"
format = '[ $symbol ]($style)'

[java]
symbol = ""
style = "fg:#E76F00 bg:#7dcfff"
format = '[ $symbol ]($style)'

[nodejs]
symbol = ""
style = "fg:#339933 bg:#7dcfff"
format = '[ $symbol ]($style)'

[python]
# Display the version of python from inside a local venv.
#
# Note this will only work when the venv is inside the project and it will only
# work in the directory that contains the venv dir but maybe this is ok?
symbol = ' '
style = "fg:#FFD43B bg:#7dcfff"
format = '[ $symbol ]($style)'

[rust]
symbol = ""
style = "fg:#CE422B bg:#7dcfff"
format = '[ $symbol ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "fg:#cbccd1 bg:#2f3549"
format = '[  $time ]($style)'


[custom.cpp]
command = "true"
when = "test -n \"$(find . -maxdepth 1 \\( -name '*.cpp' -o -name '*.cc' -o -name '*.cxx' \\) -print -quit)\""
shell = ["bash", "--noprofile", "--norc"]
symbol = ""
style = "fg:#00599C bg:#7dcfff"
format = '[ $symbol ]($style)'
description = "C++ project"

[custom.elisp]
command = "true"
when = "test -n \"$(find . -maxdepth 1 -name '*.el' -print -quit)\""
shell = ["bash", "--noprofile", "--norc"]
symbol = ""
style = "fg:#7F5AB6 bg:#7dcfff"
format = '[ $symbol ]($style)'
description = "Emacs Lisp project"

[custom.csharp]
command = "true"
when = "test -n \"$(find . -maxdepth 1 -name '*.cs' -print -quit)\""
shell = ["bash", "--noprofile", "--norc"]
symbol = "󰌛"
style = "fg:#9B4F96 bg:#7dcfff"
format = '[ $symbol ]($style)'
description = "C# project"
